name: pythia

# Copy .env.example to .env and set the database password first. Every
# published port binds to 127.0.0.1 only.
services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_USER: pythia
      POSTGRES_DB: pythia
    ports:
      # 5433 on the host because a native Postgres often owns 5432.
      - "127.0.0.1:${PYTHIA_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pythia -d pythia"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      # Keep loaded models in memory. The default unloads them after 5 idle
      # minutes, and reloading from disk can outlast the 10 s search timeout.
      OLLAMA_KEEP_ALIVE: "-1"
    ports:
      - "127.0.0.1:${PYTHIA_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    # These override the host-side values in .env with in-network addresses.
    environment:
      PYTHIA_DB_HOST: postgres
      PYTHIA_DB_PORT: "5432"
      OLLAMA_URL: http://ollama:11434
      PORT: "3000"
      # Built PWA inside the image (T18); set here so .env cannot blank it.
      PYTHIA_WEB_DIR: /app/web
    # No published port yet: the server binds to 127.0.0.1 inside the
    # container. How the host reaches it is decided with T9/T19.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
