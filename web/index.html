<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- The nav token (page frame); theme-init.js switches it for dark. -->
    <meta name="theme-color" content="#17191e" />
    <meta name="description" content="Search your notes, repos and Keep exports." />
    <!-- The standard name; Chromium warns when only the apple- one is set. Older iOS still reads the apple- one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pythia" />
    <link rel="icon" type="image/svg+xml" href="/pythia.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Pythia</title>
    <!-- Sets data-theme before first paint (no light flash in Dark). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
