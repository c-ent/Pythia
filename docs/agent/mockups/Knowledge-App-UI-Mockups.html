<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pythia — Knowledge App UI Mockups</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#17171A;color:#EDEDED;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;height:100%}
#side{flex:0 0 260px;background:#0F0F10;border-right:1px solid #26262A;display:flex;flex-direction:column;min-height:0}
#side header{padding:16px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #26262A}
.logo{width:30px;height:30px;border-radius:9px;background:#CCFF00;display:flex;align-items:center;justify-content:center;flex:none}
#side h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
#side h1 small{display:block;font-size:11px;color:#8D8D8D;font-weight:400;margin-top:2px}
#list{overflow:auto;padding:8px 8px 16px;flex:1}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7A7A7F;padding:14px 10px 6px}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;color:#D0D0D3;font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;cursor:pointer}
.item:hover{background:#1E1E21}
.item.on{background:#CCFF00;color:#0F0F10;font-weight:600}
.item i{flex:none;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
#main{flex:1;position:relative;min-width:0}
#toolbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:4px;padding:4px;background:#0F0F10ee;border:1px solid #2A2A2E;border-radius:12px;backdrop-filter:blur(8px)}
#toolbar button{border:0;background:transparent;color:#D0D0D3;font:inherit;font-size:13px;padding:7px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
#toolbar button:hover{background:#222226}
#toolbar button.on{background:#2A2A2E;color:#fff}
#zoomlbl{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.sep{width:1px;background:#2A2A2E;margin:4px 2px}
#viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;background:#17171A;background-image:radial-gradient(#2A2A2E 1px,transparent 1px);background-size:24px 24px}
#viewport.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.board{position:absolute}
.board .lbl{position:absolute;left:0;bottom:100%;padding-bottom:10px;font-size:22px;color:#A9A9AE;white-space:nowrap;cursor:pointer}
.board .lbl:hover{color:#CCFF00}
.board .frame{position:relative;width:100%;height:100%;background:#17191E;border-radius:6px;overflow:hidden;box-shadow:0 10px 40px #0008,0 0 0 1px #2A2A2E}
.board.mobile .frame{border-radius:28px}
.board.sel .frame{box-shadow:0 10px 40px #0008,0 0 0 4px #CCFF00}
.board iframe{border:0;width:100%;height:100%;display:block;background:#0F0F10}
.board .shield{position:absolute;inset:0}
.note{position:absolute;color:#BDBDC2;font-size:22px;line-height:1.45}
.note.title1{font-size:64px;font-weight:700;color:#fff;letter-spacing:-.02em}
.note.title2{font-size:44px;font-weight:600;color:#fff}
/* focus mode */
#focus{position:absolute;inset:0;display:none;flex-direction:column;background:#141416;z-index:4}
#focus.on{display:flex}
#fhead{display:flex;align-items:center;gap:10px;padding:64px 20px 12px}
#fhead h2{margin:0;font-size:17px;font-weight:600;flex:1}
#fhead button{border:1px solid #2A2A2E;background:#1B1B1E;color:#D0D0D3;font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;cursor:pointer}
#fhead button:hover{border-color:#CCFF00}
#fbody{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:8px 24px 40px}
#fwrap{transform-origin:top center;flex:none}
#fwrap .frame{background:#0F0F10;overflow:hidden;border-radius:8px;box-shadow:0 20px 60px #000a,0 0 0 1px #2A2A2E}
#fwrap.mobile .frame{border-radius:36px;box-shadow:0 20px 60px #000a,0 0 0 10px #050506,0 0 0 11px #333}
#fwrap iframe{border:0;display:block;width:100%;height:100%}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:#7A7A7F;z-index:5;pointer-events:none}
</style>
</head>

    <div class="hint" id="hint">Drag to pan · Scroll / pinch to zoom · Double-click a screen to focus · Links inside screens navigate</div>
  </main>
</div>

 the MCP server.<\/div><\/header>\n\n<div style=\"background:#FFFFFF;border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(15,15,16,0.05)\">\n<div style=\"display:flex;align-items:center;gap:10px\"><h3 style=\"margin:0;font-size:17px;font-weight:600;flex:1\">MCP server<\/h3><span style=\"display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:#E3F5D0;font-size:13px;color:#1F4D2B\"><svg aria-hidden=\"true\" width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg>Running<\/span><\/div>\n<div><label for=\"u\" style=\"display:block;font-size:13px;font-weight:600;margin-bottom:6px\">Server URL<\/label>\n<div style=\"display:flex;gap:10px\"><input id=\"u\" type=\"text\" readonly=\"\" value=\"https://pythia.tailnet-name.ts.net/mcp\" style=\"flex:1;height:46px;padding:0 14px;border-radius:12px;border:1px solid #DADAD5;font-family:'JetBrains Mono',monospace;font-size:13.5px;background:#FAFAF8\"><button type=\"button\" style=\"height:46px;padding:0 18px;border-radius:12px;border:1px solid #DADAD5;background:#FFFFFF;font-size:14px;font-weight:500;cursor:pointer\">Copy<\/button><\/div><\/div>\n<div><label for=\"tk\" style=\"display:block;font-size:13px;font-weight:600;margin-bottom:6px\">Access token<\/label>\n<div style=\"display:flex;gap:10px\"><input id=\"tk\" type=\"text\" readonly=\"\" value=\"mx_\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022c91a\" style=\"flex:1;height:46px;padding:0 14px;border-radius:12px;border:1px solid #DADAD5;font-family:'JetBrains Mono',monospace;font-size:13.5px;background:#FAFAF8\"><button type=\"button\" style=\"height:46px;padding:0 18px;border-radius:12px;border:1px solid #DADAD5;background:#FFFFFF;font-size:14px;font-weight:500;cursor:pointer\">Copy<\/button><button type=\"button\" style=\"height:46px;padding:0 18px;border-radius:12px;border:1px solid #DADAD5;background:#FFFFFF;font-size:14px;font-weight:500;cursor:pointer\">Rotate<\/button><\/div><\/div>\n<div style=\"font-size:13px;color:#5A5A5A;line-height:1.5\">Only devices on your Tailscale network can reach this address.<\/div>\n<\/div>\n\n<div style=\"background:#111113;border-radius:22px;padding:18px 22px;color:#E6E6E6;box-shadow:0 1px 2px rgba(15,15,16,0.05)\">\n<div style=\"display:flex;align-items:center;margin-bottom:10px\"><h3 style=\"margin:0;font-size:15px;font-weight:600;flex:1;color:#FFFFFF\">Claude Desktop config<\/h3><button type=\"button\" style=\"height:36px;padding:0 14px;border-radius:10px;border:1px solid #3A3A3D;background:transparent;color:#FFFFFF;font-size:13px;cursor:pointer\">Copy<\/button><\/div>\n<pre style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.65;overflow:hidden\">{\n  \"mcpServers\": {\n    \"pythia\": {\n      \"url\": \"https://pythia.tailnet-name.ts.net/mcp\",\n      \"headers\": { \"Authorization\": \"Bearer mx_...\" }\n    }\n  }\n}<\/pre>\n<\/div>\n\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n<div style=\"background:#FFFFFF;border-radius:22px;padding:18px 20px;box-shadow:0 1px 2px rgba(15,15,16,0.05)\">\n<h3 style=\"margin:0 0 10px;font-size:16px;font-weight:600\">Tools exposed<\/h3>\n<ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px\"><li style=\"padding:4px 10px;border-radius:999px;background:#F0F0EC;font-family:'JetBrains Mono',monospace;font-size:12px\">search<\/li><li style=\"padding:4px 10px;border-radius:999px;background:#F0F0EC;font-family:'JetBrains Mono',monospace;font-size:12px\">get_document<\/li><li style=\"padding:4px 10px;border-radius:999px;background:#F0F0EC;font-family:'JetBrains Mono',monospace;font-size:12px\">list_repos<\/li><li style=\"padding:4px 10px;border-radius:999px;background:#F0F0EC;font-family:'JetBrains Mono',monospace;font-size:12px\">get_repo_overview<\/li><li style=\"padding:4px 10px;border-radius:999px;background:#F0F0EC;font-family:'JetBrains Mono',monospace;font-size:12px\">recent_changes<\/li><\/ul>\n<\/div>\n<div style=\"background:#FFFFFF;border-radius:22px;padding:18px 20px;box-shadow:0 1px 2px rgba(15,15,16,0.05)\">\n<h3 style=\"margin:0 0 10px;font-size:16px;font-weight:600\">Devices<\/h3>\n<ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px\">\n<li style=\"display:flex;justify-content:space-between\"><span>Windows PC<\/span><span style=\"color:#5A5A5A\">Installed \u00b7 now<\/span><\/li>\n<li style=\"display:flex;justify-content:space-between\"><span>MacBook<\/span><span style=\"color:#5A5A5A\">Installed \u00b7 2h ago<\/span><\/li>\n<li style=\"display:flex;justify-content:space-between\"><span>iPhone<\/span><span style=\"color:#5A5A5A\">Home Screen \u00b7 1d ago<\/span><\/li>\n<li style=\"display:flex;justify-content:space-between\"><span>Android tablet<\/span><span style=\"color:#5A5A5A\">Installed \u00b7 3d ago<\/span><\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/section>\n<\/main>\n<\/div>\n<script>document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;\nvar h=a.getAttribute('href')||'';if(/\\.dc\\.html$/.test(h)){e.preventDefault();parent.postMessage({dcNav:h},'*');}\nelse if(h.charAt(0)!=='#'){e.preventDefault();}},true);\ndocument.addEventListener('submit',function(e){e.preventDefault();},true);<\/script><\/body><\/html>"}], "notes": [{"x": 0, "y": -260, "w": 240, "text": "Desktop", "kind": "title1"}, {"x": 0, "y": 3000, "w": 240, "text": "Mobile", "kind": "title1"}, {"x": 2350, "y": 4240, "w": 340, "text": "All content is sample data. Layout and lime accent follow reference 3, the pastel gradient follows reference 1, and the dark green glow follows reference 2.", "kind": "note"}, {"x": 0, "y": 5340, "w": 240, "text": "Tablet", "kind": "title1"}]};
const boards = DATA.boards, notes = DATA.notes;
const byFile = Object.fromEntries(boards.map(b => [b.file, b]));
const groupOf = b => b.title.startsWith('Desktop') ? 'Desktop' : b.title.startsWith('Mobile') ? 'Mobile' : b.title.startsWith('Tablet') ? 'Tablet' : 'Brand · Pythia logos';
const order = ['Desktop', 'Tablet', 'Mobile', 'Brand · Pythia logos'];
const ordered = order.flatMap(g => boards.filter(b => groupOf(b) === g).sort((a, c) => a.y - c.y || a.x - c.x));
document.getElementById('count').textContent = boards.length + ' screens · Pythia';

const $ = id => document.getElementById(id);
const vp = $('viewport'), world = $('world');
let sel = null, mode = 'canvas';

// sidebar
const list = $('list');
order.forEach(g => {
  const items = ordered.filter(b => groupOf(b) === g); if (!items.length) return;
  const h = document.createElement('div'); h.className = 'grp'; h.textContent = g; list.appendChild(h);
  items.forEach(b => {
    const btn = document.createElement('button'); btn.className = 'item'; btn.dataset.id = b.id;
    btn.innerHTML = '<i></i><span></span>';
    btn.querySelector('span').textContent = b.title.replace(/^(Desktop|Tablet|Mobile|Pythia):\s*/, '');
    btn.onclick = () => select(b, true);
    list.appendChild(btn);
  });
});

// world
let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
const ext = (x, y, w, h) => { minX = Math.min(minX, x); minY = Math.min(minY, y - 60); maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h); };
boards.forEach(b => {
  const el = document.createElement('div');
  el.className = 'board' + (b.w < 600 ? ' mobile' : ''); el.dataset.id = b.id;
  Object.assign(el.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' });
  const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = b.title;
  lbl.onclick = () => select(b, false); lbl.ondblclick = () => openFocus(b);
  const fr = document.createElement('div'); fr.className = 'frame';
  const ifr = document.createElement('iframe'); ifr.loading = 'lazy'; ifr.title = b.title; ifr.srcdoc = b.doc;
  const shield = document.createElement('div'); shield.className = 'shield';
  shield.addEventListener('dblclick', () => openFocus(b));
  shield.addEventListener('click', () => { if (!moved) select(b, false); });
  fr.append(ifr, shield); el.append(lbl, fr); world.appendChild(el); b.el = el; b.shield = shield;
  ext(b.x, b.y, b.w, b.h);
});
notes.forEach(n => {
  const el = document.createElement('div'); el.className = 'note ' + (n.kind || '');
  Object.assign(el.style, { left: n.x + 'px', top: (n.kind && n.kind.startsWith('title') ? n.y - 150 : n.y) + 'px', width: (n.w || 300) + 'px' });
  if (n.kind && n.kind.startsWith('title')) el.style.width = 'auto', el.style.whiteSpace = 'nowrap';
  el.textContent = n.text; world.appendChild(el);
});

// pan / zoom
let s = 1, tx = 0, ty = 0;
const apply = () => { world.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; $('zoomlbl').textContent = Math.round(s * 100) + '%'; };
const clamp = v => Math.min(4, Math.max(0.03, v));
function zoomAt(f, cx, cy) { const ns = clamp(s * f); tx = cx - (cx - tx) * ns / s; ty = cy - (cy - ty) * ns / s; s = ns; apply(); }
function fitRect(x, y, w, h, pad = 60, max = 1) {
  const W = vp.clientWidth, H = vp.clientHeight;
  s = clamp(Math.min((W - pad * 2) / w, (H - pad * 2 - 40) / h, max));
  tx = (W - w * s) / 2 - x * s; ty = (H - h * s) / 2 - y * s + 20; apply();
}
const fitAll = () => fitRect(minX, minY - 160, maxX - minX, maxY - minY + 160);
vp.addEventListener('wheel', e => {
  e.preventDefault(); const r = vp.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) > 40 && !e.shiftKey && e.deltaX === 0 && e.deltaMode === 0 && Math.abs(e.deltaY) % 1 === 0 && !e.wheelDeltaX)
    zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top);
  else { tx -= e.deltaX; ty -= e.deltaY; apply(); }
}, { passive: false });
let drag = null, moved = false;
vp.addEventListener('pointerdown', e => { if (e.button !== 0) return; drag = { x: e.clientX, y: e.clientY, tx, ty }; moved = false; vp.classList.add('drag'); });
window.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) moved = true; tx = drag.tx + dx; ty = drag.ty + dy; apply(); });
window.addEventListener('pointerup', () => { drag = null; vp.classList.remove('drag'); });
$('bIn').onclick = () => zoomAt(1.25, vp.clientWidth / 2, vp.clientHeight / 2);
$('bOut').onclick = () => zoomAt(0.8, vp.clientWidth / 2, vp.clientHeight / 2);
$('bFit').onclick = fitAll; $('zoomlbl').onclick = fitAll;

// selection — selected board becomes interactive (shield removed)
function select(b, fly) {
  sel = b;
  boards.forEach(x => { x.el.classList.toggle('sel', x === b); x.shield.style.display = x === b ? 'none' : ''; });
  document.querySelectorAll('.item').forEach(i => i.classList.toggle('on', +i.dataset.id === b.id));
  const it = list.querySelector(`.item[data-id="${b.id}"]`); it && it.scrollIntoView({ block: 'nearest' });
  if (mode === 'focus') renderFocus(); else if (fly) fitRect(b.x, b.y - 50, b.w, b.h + 50, 40);
}

// focus mode
function setMode(m) {
  mode = m; $('focus').classList.toggle('on', m === 'focus');
  $('bCanvas').classList.toggle('on', m === 'canvas'); $('bFocus').classList.toggle('on', m === 'focus');
  ['bIn', 'bOut', 'bFit', 'zoomlbl'].forEach(id => $(id).style.visibility = m === 'canvas' ? '' : 'hidden');
  $('hint').style.display = m === 'canvas' ? '' : 'none';
  if (m === 'focus') { if (!sel) select(ordered[0]); renderFocus(); }
}
function openFocus(b) { select(b); setMode('focus'); }
function renderFocus() {
  const b = sel; $('fTitle').textContent = b.title;
  const wrap = $('fwrap'); wrap.className = b.w < 600 ? 'mobile' : '';
  const fr = wrap.querySelector('.frame'); fr.style.width = b.w + 'px'; fr.style.height = b.h + 'px';
  const ifr = $('fFrame'); if (ifr.dataset.id != b.id) { ifr.srcdoc = b.doc; ifr.dataset.id = b.id; }
  const body = $('fbody'); const avail = body.clientWidth - 48;
  const k = Math.min(1, avail / b.w); wrap.style.transform = `scale(${k})`;
  wrap.style.width = b.w + 'px'; wrap.style.height = b.h * k + 'px';
}
const step = d => { const i = ordered.indexOf(sel); select(ordered[(i + d + ordered.length) % ordered.length]); };
$('fPrev').onclick = () => step(-1); $('fNext').onclick = () => step(1);
$('bCanvas').onclick = () => { setMode('canvas'); if (sel) fitRect(sel.x, sel.y - 50, sel.w, sel.h + 50, 40); };
$('bFocus').onclick = () => setMode('focus');
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && mode === 'focus') $('bCanvas').click();
  if (mode === 'focus' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) step(e.key === 'ArrowRight' ? 1 : -1);
});
window.addEventListener('resize', () => mode === 'focus' && renderFocus());

// prototype links inside screens
window.addEventListener('message', e => {
  const f = e.data && e.data.dcNav; if (!f || !byFile[f]) return;
  select(byFile[f], mode === 'canvas');
});

apply(); requestAnimationFrame(fitAll);
</script>
</body>
