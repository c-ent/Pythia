# Always-on host (T18, R10). Layered on the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What it adds:
# - app: host networking, so the server's 127.0.0.1:3000 is the host's
#   127.0.0.1:3000 and `tailscale funnel` on the host can reach it (T19). It
#   then talks to postgres and ollama through their 127.0.0.1 published ports.
#   Nothing listens on a public interface.
# - app: the vault pulled by rclone, mounted read-only at /vault, and a named
#   volume for the repo mirrors.
# - rclone: a one-way pull of the Remotely Save folder from Dropbox into the
#   vault directory every PYTHIA_RCLONE_INTERVAL_SECONDS. It never writes to
#   Dropbox. A failed pull logs and retries next round; rclone skips deletions
#   when a run had errors, and the vault indexer never empties the index on an
#   empty vault, so a network failure cannot wipe notes.
#
# Host .env needs, on top of .env.example:
#   PYTHIA_HOST_VAULT_DIR      host folder rclone writes and the app reads (default ./data/vault)
#   PYTHIA_RCLONE_CONFIG_DIR   host folder holding rclone.conf with a Dropbox remote (default ./data/rclone)
#   PYTHIA_RCLONE_SOURCE       remote path, e.g. dropbox:Apps/remotely-save/<vault name>
#   PYTHIA_REPOS_CONFIG=/config/repos.json  (optional; put repos.json in ./data/config)
#   PYTHIA_DRIVE_REMOTE=gdrive:  (optional, T61; a read-only Drive remote in rclone.conf,
#     and ./data/config/gdrive.json holding { "exclude": [] })
#   PYTHIA_OCI_TENANCY / PYTHIA_OCI_USER / PYTHIA_OCI_FINGERPRINT / PYTHIA_OCI_REGION
#     (optional, T81; put the RSA private key PEM at ./data/config/oci_api_key.pem)
services:
  app:
    network_mode: host
    pid: host
    environment:
      PYTHIA_DB_HOST: 127.0.0.1
      PYTHIA_DB_PORT: ${PYTHIA_DB_PORT:-5433}
      OLLAMA_URL: http://127.0.0.1:${PYTHIA_OLLAMA_PORT:-11434}
      PYTHIA_VAULT_PATH: /vault
      PYTHIA_REPOS_DIR: /data/repos
      # Google Drive (R19, T61): off until PYTHIA_DRIVE_REMOTE is set in .env.
      PYTHIA_DRIVE_REMOTE: ${PYTHIA_DRIVE_REMOTE:-}
      PYTHIA_DRIVE_DIR: /data/gdrive
      PYTHIA_DRIVE_CONFIG: /config/gdrive.json
      PYTHIA_RCLONE_CONFIG: /rclone/rclone.conf
      PYTHIA_HOST_ROOT: /hostfs
    volumes:
      - ${PYTHIA_HOST_VAULT_DIR:-./data/vault}:/vault:ro
      - ${PYTHIA_HOST_CONFIG_DIR:-./data/config}:/config:ro
      - repos:/data/repos
      # The Drive mirror: written only by rclone in this container, read by the indexer.
      - gdrive:/data/gdrive
      # Writable: rclone saves the refreshed Google token back into rclone.conf.
      - ${PYTHIA_RCLONE_CONFIG_DIR:-./data/rclone}:/rclone
      # Read-only host root for Settings > Server storage breakdown (R21).
      - /:/hostfs:ro

  rclone:
    image: rclone/rclone:1
    # Match the app container's `node` user (1000:1000) so OAuth token
    # refreshes in rclone.conf do not lock out the app container's Drive pull.
    user: "1000:1000"
    environment:
      SOURCE: ${PYTHIA_RCLONE_SOURCE:?set PYTHIA_RCLONE_SOURCE, e.g. dropbox:Apps/remotely-save/<vault>}
      INTERVAL: ${PYTHIA_RCLONE_INTERVAL_SECONDS:-300}
    # The config folder is writable because rclone saves refreshed Dropbox
    # tokens back into rclone.conf.
    volumes:
      - ${PYTHIA_RCLONE_CONFIG_DIR:-./data/rclone}:/config/rclone
      - ${PYTHIA_HOST_VAULT_DIR:-./data/vault}:/vault
    entrypoint: ["/bin/sh", "-c"]
    # `sync` makes /vault an exact copy of the remote (one way only). Obsidian's
    # own settings folder is not needed for search.
    command:
      - |
        while true; do
          if rclone sync "$$SOURCE" /vault --exclude '.obsidian/**' --exclude '.trash/**' --stats-one-line --stats 0 -v; then
            echo "rclone: pulled $$(date -u +%FT%TZ)"
          else
            echo "rclone: pull failed; keeping the local copy and retrying in $$INTERVAL s"
          fi
          sleep "$$INTERVAL"
        done
    restart: unless-stopped

volumes:
  repos:
  gdrive:
